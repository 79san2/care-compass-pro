name: Consultation tests
on:
  push:
    paths:
      - 'server/**'
      - 'consultation.js'
      - 'engine/**'
      - 'knowledge/**'
      - 'tests/**'
      - '.github/workflows/consult-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs

name: Consultation engine tests
on:
  push:
    paths:
      - 'engine/**'
      - 'knowledge/**'
      - '.github/workflows/consult-test.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test engine/consult.test.mjs
